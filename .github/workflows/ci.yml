name: Backend CI

# Check the proposed changes when a pull request is opened or updated.
on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # Download the repository to the GitHub runner.
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Match the Python minor version verified locally.
          python-version: '3.12'

      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      # Show test results even if lint fails, provided dependencies installed.
      - name: Run tests with pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest
