<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">Sentinel findings dashboard wireframe</title><desc id="desc">Overview, incomplete review warning, severity counts and findings list, with a placeholder detail panel.</desc><rect width="1120" height="720" fill="#f5f6f8"/>
